name: Tests

# Default suite on Linux and Windows using the LOCKED BASE environment only: the embedding model is never downloaded here.
# The pinned CPU model smoke check is a separate, manual command (see README, "Pinned CPU model smoke check").

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10   # a hung test (for example a server that never exits) fails the job instead of blocking it
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned to commit SHAs; the comments name the release each SHA is the tag target of.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
      - name: Install locked base dependencies
        run: uv sync --locked
      - name: Run the default test suite
        run: uv run --no-sync pytest -q
      - name: Viewer smoke check on the bundled real run (retrieval and model imports blocked)
        run: uv run --no-sync python scripts/viewer_smoke.py examples/demo/run.json --expect-fixture-demo
