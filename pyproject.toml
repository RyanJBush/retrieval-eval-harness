[project]
name = "retrieval-eval"
version = "0.1.0"
description = "Retrieval Evaluation Harness MVP (BM25 vs. embedding retriever)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "rank-bm25",
]

[project.optional-dependencies]
model = [
    "torch",
    "sentence-transformers",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires model download; excluded from basic CI"]
addopts = "-m 'not model'"

[tool.uv]
python-preference = "only-system"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
